<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCH Admin | Gestión de Inventario</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">
    <nav class="navbar">
        <div class="logo">LCH TIRES <span style="color:white; font-size: 12px;">ADMIN</span></div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Ver Inventario</a>
            <button class="nav-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="main-layout admin-layout">
        <!-- Formulario agregar producto -->
        <div class="form-section">
            <h3>Agregar Nueva Mercancía</h3>
            <form id="product-form">
                <div class="input-group">
                    <label>Medida</label>
                    <input type="text" id="size" placeholder="ej. 295/75R22.5" required>
                </div>
                <div class="input-group">
                    <label>Marca</label>
                    <input type="text" id="brand" placeholder="ej. Michelin" required>
                </div>
                <div class="input-group">
                    <label>Estado</label>
                    <select id="condition">
                        <option value="New">Nueva</option>
                        <option value="Used">Usada</option>
                    </select>
                </div>
                <div class="row">
                    <div class="input-group">
                        <label>Stock Inicial</label>
                        <input type="number" id="stock" placeholder="0" min="0" required>
                    </div>
                    <div class="input-group">
                        <label>Precio ($)</label>
                        <input type="number" id="price" placeholder="0.00" min="0" step="0.01" required>
                    </div>
                </div>
                <button type="submit" class="btn-save">Guardar Producto</button>
            </form>
        </div>

        <!-- Tabla inventario (ahora con BRAND y CONDITION) -->
        <div class="inventory-section">
            <h3>Listado Maestro</h3>
            <table>
                <thead>
                    <tr>
                        <th>SIZE</th>
                        <th>BRAND</th>
                        <th>CONDITION</th>
                        <th>STOCK</th>
                        <th>PRICE</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody id="admin-inventory-body"></tbody>
            </table>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
